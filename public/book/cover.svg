<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" role="img"
     aria-label="Book cover: The Adaptation Stack — Who Learns What, When, from Evolution to AI, by Nam H. Le">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4ED"/>
      <stop offset="1" stop-color="#EEE9DD"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="640" height="900" fill="url(#paper)"/>
  <!-- spine band -->
  <rect x="0" y="0" width="30" height="900" fill="#17181C"/>
  <rect x="30" y="0" width="4" height="900" fill="#1F6F8B"/>

  <!-- top rule + series -->
  <text x="78" y="86" font-family="Georgia, 'Palatino Linotype', serif" font-size="15"
        letter-spacing="3" fill="#6E7280">SPRINGER · NATURAL COMPUTING SERIES</text>
  <line x1="78" y1="104" x2="572" y2="104" stroke="#CFC9BA" stroke-width="1"/>

  <!-- title -->
  <text x="78" y="196" font-family="Georgia, 'Palatino Linotype', serif" font-weight="bold"
        font-size="62" fill="#17181C">The Adaptation</text>
  <text x="78" y="262" font-family="Georgia, 'Palatino Linotype', serif" font-weight="bold"
        font-size="62" fill="#17181C">Stack</text>
  <text x="78" y="312" font-family="Georgia, 'Palatino Linotype', serif" font-style="italic"
        font-size="25" fill="#1F6F8B">Who Learns What, When — from Evolution to AI</text>

  <!-- the stack motif: four layers, nature (left) ↔ machine (right) -->
  <g font-family="Georgia, 'Palatino Linotype', serif">
    <!-- top: social / distillation -->
    <g>
      <rect x="78" y="372" width="484" height="92" rx="4" fill="#A8641B"/>
      <rect x="78" y="372" width="484" height="92" rx="4" fill="url(#sheen)"/>
      <text x="100" y="416" font-size="24" fill="#fff">Social learning &amp; culture</text>
      <text x="540" y="444" font-size="14" letter-spacing="1" text-anchor="end" fill="#ffe6c8">≈ distillation</text>
    </g>
    <!-- lifetime learning / in-context -->
    <g>
      <rect x="78" y="472" width="484" height="92" rx="4" fill="#1F6F8B"/>
      <rect x="78" y="472" width="484" height="92" rx="4" fill="url(#sheen)"/>
      <text x="100" y="516" font-size="24" fill="#fff">Individual learning</text>
      <text x="540" y="544" font-size="14" letter-spacing="1" text-anchor="end" fill="#d6edf4">≈ in-context learning</text>
    </g>
    <!-- development / fine-tuning -->
    <g>
      <rect x="78" y="572" width="484" height="92" rx="4" fill="#2E7D5B"/>
      <rect x="78" y="572" width="484" height="92" rx="4" fill="url(#sheen)"/>
      <text x="100" y="616" font-size="24" fill="#fff">Development</text>
      <text x="540" y="644" font-size="14" letter-spacing="1" text-anchor="end" fill="#d4efe0">≈ fine-tuning</text>
    </g>
    <!-- evolution / pretraining -->
    <g>
      <rect x="78" y="672" width="484" height="92" rx="4" fill="#194E5F"/>
      <rect x="78" y="672" width="484" height="92" rx="4" fill="url(#sheen)"/>
      <text x="100" y="716" font-size="24" fill="#fff">Evolution</text>
      <text x="540" y="744" font-size="14" letter-spacing="1" text-anchor="end" fill="#cfe3ea">≈ pretraining</text>
    </g>
  </g>

  <!-- timescale arrow -->
  <text x="78" y="792" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#6E7280">
    slow, across generations ↑ fast, within a lifetime — who should carry which information, as the world changes?
  </text>

  <!-- author -->
  <line x1="78" y1="828" x2="572" y2="828" stroke="#CFC9BA" stroke-width="1"/>
  <text x="78" y="866" font-family="Georgia, 'Palatino Linotype', serif" font-size="27"
        fill="#17181C">Nam H. Le</text>
</svg>
