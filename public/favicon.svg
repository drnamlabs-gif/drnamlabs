<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .ring { fill: none; stroke: #1F6F8B; stroke-width: 3.5; stroke-linecap: round; }
    .glyph { fill: #17181C; font: 500 40px/1 Georgia, 'Times New Roman', serif; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #6FB6D2; }
      .glyph { fill: #E8EAEF; }
    }
  </style>
  <!-- An open orbit around the theta, running clockwise: the phase cycle. -->
  <circle class="ring" cx="32" cy="32" r="27" stroke-dasharray="128 42" transform="rotate(-58 32 32)"/>
  <text class="glyph" x="32" y="46" text-anchor="middle">&#920;</text>
</svg>
